id: f2_flopy_many_polygons
tier: 1
description: >
  FloPy autotest voronoi_many_polygons: a 100 x 100 square with a circular
  hole, a circle the cells conform to, a diagonal line, and two refinement
  squares (maximum areas 100, 10 and 1). The conforming circle and line keep
  the background size. Sizes are the edges of equilateral triangles of FloPy's
  Triangle maximum areas; the target is FloPy's own cell count in that test.
  FloPy's region seeds (11, 11) and (70, 70) lie on the diagonal line and on a
  corner of area2, so its own grid may refine only part of each square.
source: https://github.com/modflowpy/flopy/blob/develop/autotest/test_grid_cases.py (voronoi_many_polygons)
